<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Kedicik</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="side-right">

  <div id="nest" data-time="day">
    <!-- duvar -->
    <div class="window-sky">
      <div class="sun"></div><div class="moon"></div><i class="star a"></i><i class="star b"></i><i class="star c"></i>
      <div class="curtain l"></div><div class="curtain r"></div>
    </div>
    <div class="frame"><svg viewBox="0 0 20 18"><path d="M10 15.5 C4 11.5 2 8.5 2 6 C2 3.6 4 2 6 2 C7.7 2 9 3 10 4.4 C11 3 12.3 2 14 2 C16 2 18 3.6 18 6 C18 8.5 16 11.5 10 15.5Z"/></svg></div>
    <div class="floor"></div>

    <!-- yatak (arka) -->
    <svg id="bedBack" class="bed" viewBox="0 0 64 28">
      <defs>
        <linearGradient id="gBedRim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c9b5ea"/><stop offset="1" stop-color="#a993d6"/></linearGradient>
        <radialGradient id="gCushion" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#f1e3d6"/></radialGradient>
      </defs>
      <ellipse cx="32" cy="15" rx="30" ry="11" fill="url(#gBedRim)"/>
      <ellipse cx="32" cy="16" rx="23" ry="7" fill="url(#gCushion)"/>
    </svg>

    <div id="shadow" class="shadow"></div>
    <div id="yarnShadow" class="shadow small"></div>

    <!-- mama kabı -->
    <div id="bowl">
      <svg viewBox="0 0 30 16">
        <defs><linearGradient id="gBowl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fd0f5"/><stop offset="1" stop-color="#6ea9de"/></linearGradient></defs>
        <g class="kibble"><circle cx="9" cy="5" r="2.2"/><circle cx="13.5" cy="3.8" r="2.2"/><circle cx="18" cy="4.6" r="2.2"/><circle cx="21.5" cy="5.8" r="2"/><circle cx="15.5" cy="6.2" r="2"/></g>
        <path class="bowl-b" d="M2 6.5 h26 l-3 8 a2 2 0 0 1 -1.9 1.3 H6.9 A2 2 0 0 1 5 14.5 Z"/>
        <path class="bowl-h" d="M6 9.5 h18"/>
        <path class="bowl-fish" d="M12.5 12 q2.5 -2 5 0 q-2.5 2 -5 0z M17.5 12 l2 -1.4 v2.8z"/>
      </svg>
    </div>

    <!-- kedi -->
    <div id="cat" class="cat">
      <div id="catInner">
        <svg id="catSvg" viewBox="0 0 100 100" overflow="visible">
          <defs>
            <radialGradient id="gHead" cx=".42" cy=".3" r=".78">
              <stop offset="0" style="stop-color:var(--fur-hi)"/>
              <stop offset=".55" style="stop-color:var(--fur)"/>
              <stop offset="1" style="stop-color:var(--fur-dark)"/>
            </radialGradient>
            <radialGradient id="gBody" cx=".45" cy=".2" r=".85">
              <stop offset="0" style="stop-color:var(--fur-hi)"/>
              <stop offset=".5" style="stop-color:var(--fur)"/>
              <stop offset="1" style="stop-color:var(--fur-dark)"/>
            </radialGradient>
            <radialGradient id="gEye" cx=".5" cy=".7" r=".7">
              <stop offset="0" style="stop-color:var(--iris)"/>
              <stop offset=".75" style="stop-color:var(--eye)"/>
            </radialGradient>
            <radialGradient id="gBlush"><stop offset="0" stop-color="#ff8eaa" stop-opacity=".8"/><stop offset="1" stop-color="#ff8eaa" stop-opacity="0"/></radialGradient>
            <linearGradient id="gInner" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc1cf"/><stop offset="1" stop-color="#f493ad"/></linearGradient>
          </defs>

          <g id="all">
            <g id="tail"><path class="tail-o" d="M33 86 C16 90 6 78 10 63"/><path class="tail-f" d="M33 86 C16 90 6 78 10 63"/><path class="tail-tip" d="M10.4 66 C9.8 64.6 9.8 63.4 10 62.6"/></g>

            <g id="bodyG">
              <path class="body" d="M28 93 C23 80 28 63 50 62 C72 63 77 80 72 93 C66 98 34 98 28 93 Z"/>
              <ellipse class="belly" cx="50" cy="84" rx="12.5" ry="10"/>
              <g class="tail-wrap"><path class="tw-o" d="M30 91 C38 99.5 62 99.5 74 89"/><path class="tw-f" d="M30 91 C38 99.5 62 99.5 74 89"/></g>
              <g class="paw pawL"><ellipse cx="41" cy="93.4" rx="7.2" ry="4.8"/><path d="M38.6 92 v2.6 M41 91.7 v3 M43.4 92 v2.6"/></g>
              <g class="paw pawR"><ellipse cx="59" cy="93.4" rx="7.2" ry="4.8"/><path d="M56.6 92 v2.6 M59 91.7 v3 M61.4 92 v2.6"/></g>
            </g>

            <g id="head">
              <g class="ear ear-l"><path class="fur" d="M20 40 C16 25 19 13 24.5 10.5 C31 12 39 19 42 24 Z"/><path class="inner" d="M23.5 33 C21.5 24 23 17 26 15.5 C30 17 34.5 21 36.5 24.5 Z"/></g>
              <g class="ear ear-r"><path class="fur" d="M80 40 C84 25 81 13 75.5 10.5 C69 12 61 19 58 24 Z"/><path class="inner" d="M76.5 33 C78.5 24 77 17 74 15.5 C70 17 65.5 21 63.5 24.5 Z"/></g>
              <path class="headshape" d="M50 18 C72 18 87 31 87 48 C87 65 72 75 50 75 C28 75 13 65 13 48 C13 31 28 18 50 18 Z"/>
              <path class="fluff" d="M13.6 52 l-3.4 2.8 l4.4 0.6 M86.4 52 l3.4 2.8 l-4.4 0.6"/>
              <path class="stripe" d="M44 21.5 q1.6 5 0.8 9 M50 20.5 v10.5 M56 21.5 q-1.6 5 -0.8 9"/>
              <ellipse class="muzzle" cx="50" cy="61" rx="11.5" ry="8"/>
              <ellipse class="blush" cx="24.5" cy="59" rx="8" ry="5"/>
              <ellipse class="blush" cx="75.5" cy="59" rx="8" ry="5"/>
              <g id="eyes">
                <g class="eye"><ellipse class="eyeball" cx="34.5" cy="48.5" rx="7.4" ry="8.4"/><circle class="hl" cx="37" cy="45" r="3"/><circle class="hl2" cx="32.2" cy="52" r="1.4"/></g>
                <g class="eye"><ellipse class="eyeball" cx="65.5" cy="48.5" rx="7.4" ry="8.4"/><circle class="hl" cx="68" cy="45" r="3"/><circle class="hl2" cx="63.2" cy="52" r="1.4"/></g>
              </g>
              <path class="eye-closed" d="M27.5 50 q7 -7.5 14 0 M58.5 50 q7 -7.5 14 0"/>
              <path class="eye-sleep" d="M27.5 49 q7 5.5 14 0 M58.5 49 q7 5.5 14 0"/>
              <path class="nose" d="M47.3 56.2 h5.4 q0 2.8 -2.7 3.6 q-2.7 -0.8 -2.7 -3.6z"/>
              <path class="mouth" d="M50 59.6 q-1.4 3.6 -4.8 2.3 M50 59.6 q1.4 3.6 4.8 2.3"/>
              <ellipse class="tongue" cx="50" cy="63.2" rx="2.2" ry="1.6"/>
              <path class="whisk" d="M17 56.5 l-10 -2.4 M17 60 l-10 1.4 M83 56.5 l10 -2.4 M83 60 l10 1.4"/>
            </g>
          </g>
        </svg>
      </div>
      <div class="zzz"><span>z</span><span>z</span><span>Z</span></div>
    </div>

    <!-- yatak (ön kenar) -->
    <svg id="bedFront" class="bed" viewBox="0 0 64 28">
      <defs><linearGradient id="gBedFront" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d6c6f2"/><stop offset="1" stop-color="#b19dde"/></linearGradient></defs>
      <path d="M2.5 15 C4 25 18 27 32 27 C46 27 60 25 61.5 15 C57 21 46 23.5 32 23.5 C18 23.5 7 21 2.5 15 Z" fill="url(#gBedFront)"/>
      <path d="M10 22 q22 6 44 0" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="1.5 3"/>
    </svg>

    <!-- ip yumağı -->
    <div id="yarn">
      <svg viewBox="0 0 20 20">
        <defs><radialGradient id="gYarn" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#ffb3c6"/><stop offset=".6" stop-color="#f4839f"/><stop offset="1" stop-color="#d9607f"/></radialGradient></defs>
        <circle cx="10" cy="10" r="8.4" fill="url(#gYarn)"/>
        <path class="y-line" d="M3.5 7 q6.5 -3 13 1.5 M2.6 11 q7.5 -3 14.8 1.8 M4.5 15 q6 -2.6 11 0.8 M7 2.6 q-2.5 7.5 1 14.8 M12.5 2 q-3 8 0.5 16"/>
        <path class="y-thread" d="M17.6 13.5 q3 2.5 1.2 5.5"/>
      </svg>
    </div>

    <div id="laser"></div>
    <div id="fx"></div>
    <div id="bubble"></div>
  </div>

  <div id="menu">
    <button data-act="yarn" title="İp yumağı at">🧶</button>
    <button data-act="food" title="Mama ver">🐟</button>
    <button data-act="laser" title="Lazerle oyna">🔴</button>
    <button data-act="sleep" title="Uyut / uyandır">🌙</button>
    <button data-act="settings" title="Ayarlar">⚙️</button>
  </div>

  <div id="settings" role="dialog" aria-label="Ayarlar">
    <div class="st-head">
      <span>Ayarlar</span>
      <button class="st-close" title="Kapat">✕</button>
    </div>
    <div class="st-label">Boyut</div>
    <div class="st-sizes">
      <button data-scale="0.8"><i style="--s:.55"></i>Küçük</button>
      <button data-scale="1"><i style="--s:.7"></i>Normal</button>
      <button data-scale="1.3"><i style="--s:.85"></i>Büyük</button>
      <button data-scale="1.6"><i style="--s:1"></i>Dev</button>
    </div>
  </div>
</div>

<script src="ayarlar.js"></script>
<script src="kedi/kedi-veri.js"></script>
<script src="kedi/rig.js"></script>
<script src="cat.js"></script>
</body>
</html>
